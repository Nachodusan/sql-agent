[project]
name = "sql-agent"
version = "0.1.0"
description = "A natural-language SQL agent that recovers from its own mistakes, with a cost- and latency-annotated trace of every step."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
sql-agent = "sql_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sql_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
